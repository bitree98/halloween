<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할로윈 꼬마유령</title>
<style>
  html, body { margin:0; height:100%; overflow:hidden; background:#05061a; cursor:default; user-select:none; -webkit-user-select:none; }
  #stage { width:100%; height:100%; display:block; }

  .ghost-float { animation: floaty 3.8s ease-in-out infinite; }
  @keyframes floaty {
    0%   { transform: translateY(0px) rotate(0deg); }
    50%  { transform: translateY(-26px) rotate(-1.2deg); }
    100% { transform: translateY(0px) rotate(0deg); }
  }
  .hand-l { animation: handL 2.9s ease-in-out infinite; }
  .hand-r { animation: handR 3.3s ease-in-out infinite; }
  @keyframes handL { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(-10px,-30px) rotate(-10deg)} }
  @keyframes handR { 0%,100%{transform:translate(0,0) rotate(0)} 50%{transform:translate(10px,-24px) rotate(10deg)} }

  .star { animation: twinkle 2.6s ease-in-out infinite; }
  @keyframes twinkle { 0%,100%{opacity:.25} 50%{opacity:1} }
  .cloud { animation: drift 60s linear infinite; }
  .cloud.c2 { animation-duration: 85s; animation-delay: -30s; }
  @keyframes drift { from { transform: translateX(-500px); } to { transform: translateX(2400px); } }
  .window { animation: flicker 1.7s steps(2, end) infinite; }
  .window.w2 { animation-duration: 2.3s; animation-delay: .4s; }
  .window.w3 { animation-duration: 1.3s; animation-delay: .9s; }
  @keyframes flicker { 0%,100%{opacity:.95} 50%{opacity:.55} }
  .pumpkin-light { animation: pglow 2.2s ease-in-out infinite; }
  @keyframes pglow { 0%,100%{opacity:.75} 50%{opacity:1} }
  .aura { animation: breathe 3.8s ease-in-out infinite; }

  /* 2단계 디버그 패널 (d 키로 숨김/표시) */
  #debug { position:fixed; left:12px; top:12px; width:260px; padding:10px 12px; background:rgba(0,0,0,.6); color:#dfe6ff; font:13px/1.5 monospace; border-radius:10px; z-index:10; pointer-events:none; }
  #debug.hidden { display:none; }
  #debug button { pointer-events:auto; font:13px monospace; padding:6px 10px; margin:2px; border:0; border-radius:6px; background:#3a4190; color:#fff; }
  #debug .row { display:flex; flex-wrap:wrap; }
  #tapZone { position:fixed; left:0; top:0; width:140px; height:140px; z-index:20; }
  #startScreen { position:fixed; left:0; top:0; right:0; bottom:0; width:100%; height:100%; z-index:30; background:rgba(5,6,26,.92); display:flex; flex-direction:column; align-items:center; justify-content:center; color:#e9ecff; font-family:-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif; }
  #startScreen h1 { font-size:64px; margin:0 0 20px; }
  #startScreen p { font-size:26px; opacity:.8; margin:0; }
  #startScreen.hidden { display:none; }
  #debug canvas { display:block; width:240px; height:135px; background:#000; margin-bottom:6px; border-radius:6px; }
  .bar { height:8px; background:#2a2f6a; border-radius:4px; margin:2px 0 6px; overflow:hidden; }
  .bar i { display:block; height:100%; background:#7fd0ff; width:0; }
  @keyframes breathe { 0%,100%{opacity:.3} 50%{opacity:.5} }
</style>
</head>

<video id="cam" autoplay playsinline muted style="display:none"></video>
<div id="tapZone"></div>
<div style="position:fixed;right:6px;bottom:4px;color:#8892c8;font:11px monospace;opacity:.6;z-index:5">v8</div>
<div id="startScreen"><h1>화면을 터치해서 시작</h1><p>카메라와 마이크 권한을 허용해 주세요</p></div>

  <div>중 <span id="vC">0</span></div><div class="bar"><i id="bC"></i></div>

      <g id="eyes">
        <g id="eyeL" transform="translate(166 212)">
          <ellipse rx="13" ry="24" fill="url(#gEye)"/>

      <ellipse id="cheekR" cx="266" cy="243" rx="22" ry="13" fill="url(#blush)"/>
      <!-- 입 (상황별 교체 자리) -->
      <g id="mouth">
        <path id="mouthPath" d="M188 248 Q200 260 212 248" fill="none" stroke="#0d0e33" stroke-width="4" stroke-linecap="round"/>
        <path id="mouthOpen" d="M184 246 Q200 272 216 246 Q200 254 184 246 Z" fill="#1a1238" opacity="0"/>
        <path id="mouthTongue" d="M192 254 Q200 262 208 254" fill="none" stroke="#ff8fc2" stroke-width="5" stroke-linecap="round" opacity="0"/>
      </g>

  <!-- 분리된 손 (몸과 독립) -->
  <g id="handL" transform="translate(640 620)">
    <g class="hand-l"><g id="handLg">
      <ellipse cx="8" cy="34" rx="90" ry="34" fill="url(#softShadow)" opacity=".7"/>
      <ellipse rx="84" ry="60" transform="rotate(-20)" fill="url(#gHand)"/>
      <ellipse cx="-28" cy="-24" rx="28" ry="14" transform="rotate(-20)" fill="#fff" opacity=".8"/>
    </g></g>

  <g id="handR" transform="translate(1280 620)">
    <g class="hand-r"><g id="handRg">
      <ellipse cx="8" cy="34" rx="90" ry="34" fill="url(#softShadow)" opacity=".7"/>
      <ellipse rx="84" ry="60" transform="rotate(20)" fill="url(#gHand)"/>

  <use href="#sparkle" transform="translate(1370 360) scale(1.1)" fill="#ffe58a" opacity=".8"/>
  <use href="#sparkle" transform="translate(600 400) scale(1.5)" fill="#ffe58a"/>
</svg>

<script>
  const NS = 'http://www.w3.org/2000/svg';

  (function () {
    const g = document.getElementById('stars');
    for (let i = 0; i < 130; i++) {
      const c = document.createElementNS(NS, 'circle');
      c.setAttribute('cx', (Math.random() * 1920).toFixed(1));
      c.setAttribute('cy', (Math.random() * 640).toFixed(1));
      c.setAttribute('r', (1 + Math.random() * 2.4).toFixed(1));
      c.setAttribute('class', 'star');
      c.style.animationDelay = (Math.random() * 2.6).toFixed(2) + 's';
      g.appendChild(c);
    }
  })();

  // 호박 눈 깜박임
  (function () {
    const pumps = document.querySelectorAll('#pumpkins use');
    const layer = document.createElementNS(NS, 'g');
    document.getElementById('pumpkins').appendChild(layer);
    const lids = [];
    pumps.forEach(u => {
      const lid = document.createElementNS(NS, 'g');
      lid.setAttribute('transform', u.getAttribute('transform'));
      lid.innerHTML = '<polygon points="-62,-10 -18,-40 -14,0" fill="#d9701a"/><polygon points="62,-10 18,-40 14,0" fill="#d9701a"/>';
      lid.style.opacity = '0';
      layer.appendChild(lid);
      lids.push(lid);
    });
    function blink(lid) {
      lid.style.opacity = '1';
      setTimeout(() => { lid.style.opacity = '0'; }, 140);
      if (Math.random() < 0.35) setTimeout(() => {
        lid.style.opacity = '1';
        setTimeout(() => { lid.style.opacity = '0'; }, 120);
      }, 260);
    }
    function schedule(i) { setTimeout(() => { blink(lids[i]); schedule(i); }, 1800 + Math.random() * 4500); }
    lids.forEach((_, i) => schedule(i));
  })();

  // 박쥐
  (function () {
    const g = document.getElementById('bats');
    const bats = [];
    for (let i = 0; i < 9; i++) {
      const use = document.createElementNS(NS, 'use');
      use.setAttribute('href', '#batShape');
      g.appendChild(use);
      bats.push({ el: use, x: Math.random() * 1920, y: 120 + Math.random() * 420,
        vx: (0.8 + Math.random() * 1.6) * (Math.random() < 0.5 ? -1 : 1),
        phase: Math.random() * Math.PI * 2, flap: 0.18 + Math.random() * 0.12, scale: 0.6 + Math.random() * 0.9 });
    }
    let t = 0;
    function step() {
      t += 1;
      for (const b of bats) {
        b.x += b.vx; b.y += Math.sin(t * 0.03 + b.phase) * 0.9;
        if (b.x < -120) { b.x = 2040; b.y = 120 + Math.random() * 420; }
        if (b.x > 2040) { b.x = -120; b.y = 120 + Math.random() * 420; }
        const flapY = 1 - Math.abs(Math.sin(t * b.flap + b.phase)) * 0.75;
        const face = b.vx < 0 ? -1 : 1;
        b.el.setAttribute('transform', `translate(${b.x.toFixed(1)} ${b.y.toFixed(1)}) scale(${(b.scale*face).toFixed(2)} ${(b.scale*flapY).toFixed(2)})`);
      }
      requestAnimationFrame(step);
    }
    step();
  })();

  // 시선: 눈 전체가 조금 움직임 (2단계에서 카메라가 lookTarget 을 바꿈)
  const lookTarget = { x: 0, y: 0 };
  const lookNow = { x: 0, y: 0 };
  const EYE_RANGE_X = 22;  // 유령 좌표계(scale 전) 기준
  const EYE_RANGE_Y = 14;
  const MOUTH_RANGE_X = 12;
  const MOUTH_RANGE_Y = 8;
  const eyeL = document.getElementById('eyeL');
  const eyeR = document.getElementById('eyeR');
  const mouth = document.getElementById('mouth');
  const stage = document.getElementById('stage');

  // 마우스는 테스트용 보조 입력: 움직인 뒤 2초 동안만 우선
  let mouseUntil = 0;
  window.addEventListener('mousemove', (e) => {
    const rect = stage.getBoundingClientRect();
    lookTarget.x = Math.max(-1, Math.min(1, ((e.clientX - rect.left) / rect.width) * 2 - 1));
    lookTarget.y = Math.max(-1, Math.min(1, ((e.clientY - rect.top) / rect.height) * 2 - 1));
    mouseUntil = performance.now() + 2000;
  });

  // ===== 2단계: 카메라 움직임 감지 =====
  // 결과는 window.motion 에 계속 갱신됨 (3단계 이후 반응 판정에 사용)
  //   motion.total   : 전체 움직임량 (0~1)
  //   motion.left/center/right : 구역별 움직임량 (0~1)
  //   motion.cx, cy  : 움직임 중심 위치 (-1~1, 화면 기준)
  const motion = { total: 0, left: 0, center: 0, right: 0, centerTop: 0, topBand: 0, bottomBand: 0, topCx: 0, topL: 0, topR: 0, cx: 0, cy: 0, ok: false };
  window.motion = motion;

  const CAM_W = 96, CAM_H = 54;      // 분석 해상도 (작을수록 가벼움)
  const DIFF_THRESHOLD = 28;         // 픽셀 밝기 차이가 이 값 이상이면 "움직임"
  const MIN_MOTION = 0.004;          // 이보다 적으면 무시 (노이즈)
  let MIRROR = true;                 // 전면 카메라 좌우 반전 (m 키로 토글)

  const video = document.getElementById('cam');
  const work = document.createElement('canvas');
  work.width = CAM_W; work.height = CAM_H;
  const wctx = work.getContext('2d', { willReadFrequently: true });
  const dbg = document.getElementById('debug');
  const dbgCanvas = document.getElementById('dbgCanvas');
  const dctx = dbgCanvas.getContext('2d');
  const $ = id => document.getElementById(id);
  let prev = null;

  window.addEventListener('keydown', (e) => {
    if (e.key === 'd') dbg.classList.toggle('hidden');
    if (e.key === 'm') toggleMirror();
  });

  function toggleMirror() { MIRROR = !MIRROR; $('vM').textContent = MIRROR ? 'on' : 'off'; }
  async function startCamera() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 360, facingMode: 'user' }, audio: false });
      video.srcObject = stream;
      await video.play();
      motion.ok = true;
      $('dbgStatus').textContent = '카메라 동작 중';
      analyze();
    } catch (err) {
      $('dbgStatus').textContent = '카메라 실패: ' + err.name;
    }
  }

  function analyze() {
    if (video.readyState >= 2) {
      wctx.drawImage(video, 0, 0, CAM_W, CAM_H);
      const img = wctx.getImageData(0, 0, CAM_W, CAM_H);
      const d = img.data;
      const n = CAM_W * CAM_H;
      const gray = new Uint8Array(n);
      for (let i = 0; i < n; i++) gray[i] = (d[i*4] * 0.3 + d[i*4+1] * 0.59 + d[i*4+2] * 0.11) | 0;

      if (prev) {
        let total = 0, sumX = 0, sumY = 0, zl = 0, zc = 0, zr = 0, zct = 0, tb = 0, bb = 0, tSumX = 0, tL = 0, tR = 0;
        const dd = dctx.createImageData(CAM_W, CAM_H);
        for (let y = 0; y < CAM_H; y++) {
          for (let x = 0; x < CAM_W; x++) {
            const i = y * CAM_W + x;
            const moved = Math.abs(gray[i] - prev[i]) > DIFF_THRESHOLD;
            if (moved) {
              total++; sumX += x; sumY += y;
              if (x < CAM_W / 3) zl++; else if (x < CAM_W * 2 / 3) { zc++; if (y < CAM_H / 2) { zct++; tSumX += x; if (x < CAM_W / 2) tL++; else tR++; } } else zr++;
              if (y < CAM_H * 0.3) tb++; if (y > CAM_H * 0.6) bb++;
              dd.data[i*4] = 255; dd.data[i*4+1] = 240; dd.data[i*4+2] = 120;
            } else {
              const g = gray[i] >> 2;
              dd.data[i*4] = g; dd.data[i*4+1] = g; dd.data[i*4+2] = g + 20;
            }
            dd.data[i*4+3] = 255;
          }
        }
        dctx.putImageData(dd, 0, 0);
        const zone = n / 3;
        motion.total = total / n;
        motion.left = zl / zone; motion.center = zc / zone; motion.right = zr / zone; motion.centerTop = zct / (zone / 2);
        motion.topBand = tb / (n * 0.3); motion.bottomBand = bb / (n * 0.4);
        motion.topL = tL / (zone / 4); motion.topR = tR / (zone / 4);
        if (zct > 0) { let tx = (tSumX / zct) / CAM_W * 2 - 1; if (MIRROR) tx = -tx; motion.topCx = tx; }
        if (motion.total > MIN_MOTION) {
          let cx = (sumX / total) / CAM_W * 2 - 1;
          const cy = (sumY / total) / CAM_H * 2 - 1;
          if (MIRROR) cx = -cx;
          motion.cx = cx; motion.cy = cy;
          if (performance.now() > mouseUntil) {
            lookTarget.x = cx;
            lookTarget.y = cy * 0.6;
          }
        }
        if (MIRROR) {
          // 패널 표시만 반전 (사람이 보는 방향과 맞추기)
          const l = motion.left; motion.left = motion.right; motion.right = l;
        }
        $('vL').textContent = motion.left.toFixed(3);  $('bL').style.width = Math.min(100, motion.left * 2000) + '%';
        $('vC').textContent = motion.center.toFixed(3); $('bC').style.width = Math.min(100, motion.center * 2000) + '%';
        $('vR').textContent = motion.right.toFixed(3); $('bR').style.width = Math.min(100, motion.right * 2000) + '%';
        $('vX').textContent = motion.cx.toFixed(2);
      }
      prev = gray;
    }
    setTimeout(analyze, 40); // 초당 약 25회 분석
  }

  // ===== 3단계: 마이크 소리 감지 =====
  // 결과는 window.sound 에 갱신됨
  //   sound.level : 현재 소리 크기 (0~1)
  //   sound.db    : 주변 소음 대비 현재 크기 (dB). 0 = 조용할 때와 같음
  //   sound.event : 마지막 판정 ('clap' 박수 두 번 / 'shout' 외침 / 'talk' 말하기 / 'scream' 아주 큰 소리)
  const sound = { level: 0, db: 0, event: null, eventAt: 0, ok: false };
  let muteUntil = 0;                         // 이 시각까지는 소리 판정 안 함 (자기 효과음·음성인식 시작음 무시)
  function muteSound(ms) { muteUntil = Math.max(muteUntil, performance.now() + ms); }
  window.sound = sound;
  const soundListeners = [];
  window.onSound = fn => soundListeners.push(fn);

  // 판정 기준은 전부 "주변 소음 대비 몇 dB 큰가"로 잡아서 장소가 바뀌어도 자동으로 맞춰짐
  let SENS = 0;                 // 전체 민감도 보정 (dB). [ ] 키 또는 패널 버튼
  // 기준 프리셋: 기기 마이크는 자동 음량 조절 때문에 조용함~외침 차이가 작아서 값이 낮음
  const PRESETS = { device: { talk: 6, shout: 14, scream: 22 }, mac: { talk: 14, shout: 34, scream: 44 } };
  let PRESET = 'device';
  let TALK_DB = PRESETS[PRESET].talk, SHOUT_DB = PRESETS[PRESET].shout, SCREAM_DB = PRESETS[PRESET].scream;
  function setPreset(name) {
    PRESET = name; TALK_DB = PRESETS[name].talk; SHOUT_DB = PRESETS[name].shout; SCREAM_DB = PRESETS[name].scream; SENS = 0;
    $('vSens').textContent = SENS;
    const b = document.getElementById('btnPreset'); if (b) b.textContent = '기준: ' + (name === 'device' ? '기기' : '맥') + ' (' + TALK_DB + '/' + SHOUT_DB + '/' + SCREAM_DB + ')';
  }
  const CLAP_MAX_MS = 90;       // 박수 한 번의 최대 길이
  const CLAP_GAP_MIN = 120, CLAP_GAP_MAX = 700;
  const QUIET_BEFORE_MS = 250;  // 박수로 치려면 직전 이 시간 동안 조용했어야 함 (말소리 음절과 구분)
  const SHOUT_MIN_MS = 100, SHOUT_MAX_MS = 700;
  const TALK_MIN_MS = 600;
  const EVENT_COOLDOWN = 1200;

  function fireSound(type, db) {
    const now = performance.now();
    if ((type === 'talk' || type === 'shout') && typeof listenBurst === 'function') listenBurst();
    if (sound.event === type && now - sound.eventAt < EVENT_COOLDOWN) return;
    sound.event = type; sound.eventAt = now;
    $('vEv').textContent = type + ' (' + db.toFixed(0) + 'dB)';
    soundListeners.forEach(fn => fn(type, db));
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === '[') setSens(-2);
    if (e.key === ']') setSens(2);
  });

  function setSens(d) { SENS += d; $('vSens').textContent = SENS; }
  async function startMic() {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({
        audio: { echoCancellation: false, noiseSuppression: false, autoGainControl: false }, video: false });
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const src = ac.createMediaStreamSource(stream);
      const an = ac.createAnalyser();
      an.fftSize = 1024;
      src.connect(an);
      const buf = new Float32Array(an.fftSize);
      sound.ok = true;
      $('micStatus').textContent = '동작 중';

      let floor = 0.002;                 // 주변 소음 바닥
      const floorHist = [];              // 최근 4초 rms 표본 (0.1초마다)
      let floorSampleAt = 0;
      let above = false, burstStart = 0, burstPeakDb = 0;
      let lastBurstEnd = -9999, lastBurstLen = 0, lastBurstWasClap = false;
      let lastQuietAt = 0;               // 마지막으로 조용했던 시각
      let talking = false, talkStart = 0;

      function loop() {
        an.getFloatTimeDomainData(buf);
        let sum = 0;
        for (let i = 0; i < buf.length; i++) sum += buf[i] * buf[i];
        const rms = Math.min(1, Math.sqrt(sum / buf.length));
        const now = performance.now();

        // 소음 바닥: 최근 4초 표본의 하위 30% 값 (바닥이 들쭉날쭉한 마이크에서도 안정)
        if (now - floorSampleAt > 100) {
          floorSampleAt = now; floorHist.push(rms); if (floorHist.length > 40) floorHist.shift();
          const sorted = floorHist.slice().sort((a, b) => a - b);
          floor = Math.max(0.0005, sorted[Math.floor(sorted.length * 0.3)]);
        }

        const db = Math.max(0, 20 * Math.log10(rms / floor)) - SENS;
        sound.level = rms; sound.db = db;
        $('vS').textContent = db.toFixed(0) + 'dB';
        $('bS').style.width = Math.min(100, db / 50 * 100) + '%';

        if (db < TALK_DB) lastQuietAt = now;
        if (now < muteUntil) { above = false; talking = false; lastQuietAt = now; requestAnimationFrame(loop); return; }

        // 큰 소리 묶음(burst)
        if (db > SHOUT_DB) {
          if (!above) { above = true; burstStart = now; burstPeakDb = 0; }
          burstPeakDb = Math.max(burstPeakDb, db);
        } else if (above) {
          above = false;
          const len = now - burstStart;
          const wasQuiet = (burstStart - lastQuietAtBeforeBurst) <= 40;
          if (burstPeakDb > SCREAM_DB && len > 150) {
            fireSound('scream', burstPeakDb); lastBurstLen = 0;
          } else if (len <= CLAP_MAX_MS && wasQuiet) {
            const gap = burstStart - lastBurstEnd;
            if (lastBurstWasClap && gap >= CLAP_GAP_MIN && gap <= CLAP_GAP_MAX) {
              fireSound('clap', burstPeakDb); lastBurstWasClap = false;
            } else { lastBurstWasClap = true; }
          } else if (len >= SHOUT_MIN_MS && len <= SHOUT_MAX_MS) {
            fireSound('shout', burstPeakDb); lastBurstWasClap = false;
          } else {
            lastBurstWasClap = false;
          }
          lastBurstEnd = now; lastBurstLen = len;
        }
        if (!above) lastQuietAtBeforeBurst = lastQuietAt;

        // 말하기: TALK_DB 이상이 이어지되, 큰 소리 묶음 중이 아닐 때
        if (db > TALK_DB) {
          if (!talking) { talking = true; talkStart = now; }
          else if (now - talkStart > TALK_MIN_MS && !above && db < SHOUT_DB) { fireSound('talk', db); talkStart = now + 2500; }
        } else if (talking && now - lastQuietAt > 350) { talking = false; }

        requestAnimationFrame(loop);
      }
      let lastQuietAtBeforeBurst = 0;
      loop();
    } catch (err) {
      $('micStatus').textContent = '실패: ' + err.name;
    }
  }

  // ===== 4단계: 음성 인식 키워드 (ㄷ 방식: 안 되면 3단계 소리 패턴이 대신 반응) =====
  // 결과는 window.speech 에 갱신되고, 키워드가 잡히면 onSpeech 리스너로 'candy' 가 전달됨
  const speech = { ok: false, lastText: '', lastHit: null, lastHitAt: 0 };
  window.speech = speech;
  const speechListeners = [];
  window.onSpeech = fn => speechListeners.push(fn);

  // 사탕 요청으로 볼 키워드 (띄어쓰기 무시하고 포함 여부만 봄)
  const CANDY_WORDS = ['트릭', '트릿', '츄릭', '트리커', '트리코', '틀릭', '트익', '사탕', '사당', '싸탕', '캔디', '켄디', '캔티', '캔디', '먹어도', '먹어', '먹을', '머거', '가져가', '가져도', '가저', '주세요', '주세', '줘'];
  const LOVE_WORDS = ['사랑', '하트', '러브', '좋아해', '사랑해', '아이러브유', '러뷰', 'loveyou', 'love', 'heart'];
  const SPEECH_COOLDOWN = 2500;

  function checkKeywords(text) {
    const t = text.replace(/\s+/g, '').toLowerCase();
    const love = LOVE_WORDS.find(w => t.includes(w));
    const hit = love || CANDY_WORDS.find(w => t.includes(w));
    if (!hit) return;
    const now = performance.now();
    if (now - speech.lastHitAt < SPEECH_COOLDOWN) return;
    speech.lastHit = hit; speech.lastHitAt = now;
    const kind = love ? 'love' : 'candy';
    $('srHit').textContent = hit + ' → ' + kind;
    speechListeners.forEach(fn => fn(kind, hit));
  }

  // 음성인식 모드: 'auto' = 말소리가 감지될 때만 잠깐 켬 (A), 'off' = 안 씀 (B)
  let SR_MODE = 'auto';
  let rec = null, recActive = false, recStopTimer = null;
  const SR_LISTEN_MS = 5000;     // 한 번 켜면 이만큼 듣고 끔

  function startSpeech() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) { $('srStatus').textContent = '이 브라우저는 미지원'; return; }
    rec = new SR();
    rec.lang = 'ko-KR';
    rec.continuous = true;
    rec.interimResults = true;
    rec.maxAlternatives = 3;
    rec.onstart = () => { speech.ok = true; recActive = true; $('srStatus').textContent = '듣는 중'; muteSound(700); };
    rec.onresult = (ev) => {
      let text = '', all = '';
      for (let i = ev.resultIndex; i < ev.results.length; i++) {

    try { if ('wakeLock' in navigator) { wakeLock = await navigator.wakeLock.request('screen'); } } catch (e) {}
  }
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && started) requestWakeLock(); });

  // 왼쪽 위 모서리 5번 연속 터치 → 패널 표시/숨김
  let taps = [];
  function cornerTap() {
    const now = performance.now();
    taps = taps.filter(t => now - t < 2000); taps.push(now);
    if (taps.length >= 5) { dbg.classList.toggle('hidden'); taps = []; }
  }
  $('tapZone').addEventListener('click', cornerTap);

  // 패널 버튼
  $('btnSensDown').addEventListener('click', () => setSens(-2));
  $('btnSensUp').addEventListener('click', () => setSens(2));
  $('btnMirror').addEventListener('click', toggleMirror);
  $('btnHide').addEventListener('click', () => dbg.classList.add('hidden'));
  $('btnSr').addEventListener('click', () => setSrMode(SR_MODE === 'auto' ? 'off' : 'auto'));
  $('btnPreset').addEventListener('click', () => setPreset(PRESET === 'device' ? 'mac' : 'device'));
  setPreset('device');
  const reactBtns = [['지나감','pass','R'],['멈춤','stand'],['인사','wave','one'],['사탕','candy'],['박수','clap'],['비명','scream'],['잠','sleep'],['하트','love']];
  reactBtns.forEach(([label, name, arg]) => { const b = document.createElement('button'); b.textContent = label; b.addEventListener('click', () => react(name, arg)); $('btnReacts').appendChild(b); });
</script>
</body>
</html>
